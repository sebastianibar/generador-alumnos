<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de alumnos</title>
    <script src="./js/function.js"></script>
    
    <style>
        :root {
            /* Aquí cambiamos los colores a rojo */
            --primary-color: #dc2626; 
            --primary-hover: #b91c1c; 
            
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-color: #1f2937;
            --border-color: #d1d5db;
            --code-bg: #1e293b;
            --code-text: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            padding: 2rem 1rem;
            line-height: 1.5;
        }

        .container {
            background-color: var(--card-bg);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            width: 100%;
            max-width: 800px;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            color: var(--primary-color);
            text-align: center;
        }

        .controls-group {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1.5rem;
            align-items: center;
        }

        label {
            font-weight: 600;
            font-size: 0.9rem;
        }

        input[type="number"], select {
            padding: 0.5rem;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s ease;
        }

        input[type="number"]:focus, select:focus {
            border-color: var(--primary-color);
        }

        input[type="button"] {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 6px;
            font-size: 0.9rem;
            cursor: pointer;
            font-weight: 600;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        input[type="button"]:hover {
            background-color: var(--primary-hover);
        }

        input[type="button"]:active {
            transform: scale(0.98);
        }

        .btn-secondary {
            background-color: #e5e7eb !important;
            color: var(--text-color) !important;
        }

        .btn-secondary:hover {
            background-color: #d1d5db !important;
        }

        .actions {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border-color);
        }

        #salida {
            background-color: var(--code-bg);
            color: var(--code-text);
            padding: 1.5rem;
            border-radius: 8px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.9rem;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 400px;
            overflow-y: auto;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Generador de Datos de Alumnos</h1>
        
        <div class="controls-group">
            <label for="registros">Número de registros:</label>
            <input type="number" id="registros" value="1" min="1" max="50000">
            <input type="button" class="btn-secondary" value="Registros 1" onclick="document.getElementById('registros').value=1;">
            <input type="button" class="btn-secondary" value="Registros 50000" onclick="document.getElementById('registros').value=50000;">
        </div>

        <div class="controls-group">
            <label for="opcion">Tipo de archivo:</label>
            <select id="opcion">
                <option value="1">SQL MySQL/MariaDB</option>
                <option value="2">Postgresql</option>
                <option value="3">CSV</option>
                <option value="4">JSON</option>
            </select>
        </div>

        <div class="actions">
            <input type="button" value="Generar" onclick="generar()">
            <input type="button" value="Guardar" onclick="guardarArchivo()">
        </div>

        <pre id="salida">El codigo generado aparecera aqui...</pre>
    </div>
</body>

</html>
